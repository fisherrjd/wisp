<!doctype html>
<html lang="en" data-theme="dusk" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wisp — one work item, one tmux session</title>
    <meta
      name="description"
      content="wisp turns a unit of work into a running tmux session: finds the item, reprovisions its git worktrees, writes the agent's context, and drops you in."
    />
    <script>
      // Stamped before first paint so the page never flashes the wrong half.
      // One preset, dusk, so only the mode is a choice; an unset mode follows
      // the system rather than picking a side for you.
      ;(function () {
        var mode
        try {
          mode = localStorage.getItem('wisp.docs.mode')
        } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.classList.toggle('dark', mode === 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
